[workspace]
members = [
    "crates/memorycore-core",
    "crates/memorycore-daemon",
    "crates/memorycore-graph",
    "crates/memorycore-cli",
    "crates/memorycore-api",
    "crates/memorycore-plugin-host",
    "crates/memorycore-embeddings",
    "crates/memorycore-adapters",
    "crates/memorycore-harness",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
tempfile = "3"
libc = "0.2"
tiny_http = "0.12"
tree-sitter = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-javascript = "0.20"
tree-sitter-typescript = "0.20"
notify = "6"
